<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>날아라 슈퍼카</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: one-screen arcade cabinet — HUD strip on top, chase-camera 3D road in the middle, fuel gauge and three big pedals at the bottom */
:root {
  --night: #13151b;
  --panel: #1f232d;
  --edge: #353b4a;
  --asphalt: #2a2e38;
  --paint: #ece6d4;
  --amber: #ffb21e;
  --kerb: #d8463b;
  --go: #3fbf7f;
  --ink: #f5f2ea;
  --muted: #9aa0ad;
  --font-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  word-break: keep-all;
  overflow-wrap: break-word;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.app {
  height: 100%;
  max-width: 460px;
  margin: 0 auto;
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  gap: 10px;
  padding-block: 10px;
}

/* HUD: a supercar dashboard — time on the left, speedometer in the middle, score on the right */
.hud {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 8px 14px 6px;
  background: linear-gradient(180deg, #272c38, #1a1e27);
  border: 1px solid var(--edge);
  border-radius: 16px;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .06), 0 6px 18px rgb(0 0 0 / .35);
  font-variant-numeric: tabular-nums;
}
.hud-cell { display: grid; gap: 3px; min-width: 0; }
.hud-cell.right { text-align: right; }
.hud-label { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.hud-time, .hud-score {
  font-family: var(--font-display);
  font-size: clamp(26px, 7.5vw, 34px);
  line-height: 1;
  white-space: nowrap;
}
.hud-time { color: var(--amber); text-shadow: 0 0 14px rgb(255 178 30 / .35); }
.hud-time small { font-size: .5em; margin-left: 2px; color: var(--muted); text-shadow: none; }
.hud-score { color: var(--ink); }
.gauge { position: relative; width: 96px; height: 58px; display: grid; justify-items: center; }
.gauge svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.gauge-track, .gauge-fill { fill: none; stroke-width: 7; stroke-linecap: round; }
.gauge-track { stroke: var(--edge); }
.gauge-fill { stroke: var(--amber); stroke-dasharray: 8 100; transition: stroke-dasharray .4s, stroke .4s; filter: drop-shadow(0 0 4px rgb(255 178 30 / .6)); }
.gauge.hot .gauge-fill { stroke: var(--kerb); filter: drop-shadow(0 0 5px rgb(216 70 59 / .7)); }
.gauge-num { position: absolute; bottom: 12px; font-family: var(--font-display); font-size: 22px; line-height: 1; }
.gauge-unit { position: absolute; bottom: 0; font-size: 10px; color: var(--muted); letter-spacing: .06em; }

/* Fuel gauge sits right under the road, where eyes and thumbs already are */
.fuelrow {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  background: linear-gradient(180deg, #272c38, #1a1e27);
  border: 1px solid var(--edge);
  border-radius: 14px;
  box-shadow: inset 0 1px 0 rgb(255 255 255 / .06);
  font-size: 13px; font-weight: 600;
  color: var(--amber);
  white-space: nowrap;
}
.pump { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.fuel-end { font-family: var(--font-display); font-weight: 400; font-size: 13px; color: var(--muted); }
.fuel-bar { position: relative; flex: 1; min-width: 0; height: 14px; border-radius: 7px; background: #11141a; box-shadow: inset 0 1px 3px rgb(0 0 0 / .6); overflow: hidden; }
.fuel-bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 100%; border-radius: 7px; background: linear-gradient(180deg, #ffd36b, var(--amber) 45%, #e08a00); box-shadow: 0 0 10px rgb(255 178 30 / .5); transition: width .25s; }
.fuel-count { padding: 3px 9px; border-radius: 999px; background: rgb(255 178 30 / .14); }
.fuelrow.low .fuel-count { background: rgb(216 70 59 / .18); }
/* tick at every hop's worth of fuel (flyCost = 35) */
.fuel-bar::before, .fuel-bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 2px; background: var(--night); z-index: 1; }
.fuel-bar::before { left: 35%; }
.fuel-bar::after { left: 70%; }
.fuel-count { min-width: 5.4em; text-align: center; font-variant-numeric: tabular-nums; }
.fuelrow.low { color: var(--kerb); border-color: var(--kerb); }
.fuelrow.low .fuel-bar i { background: var(--kerb); box-shadow: none; }
.fuelrow.gain { animation: gain .6s ease-out; }
/* rainbow flight: spectrum border and timer pill */
.fuelrow.rainbow {
  border: 1px solid transparent;
  background: linear-gradient(180deg, #272c38, #1a1e27) padding-box, linear-gradient(90deg, #ff5f6d, #ffc371, #5ee7a0, #4facfe, #a18cd1) border-box;
}
.fuelrow.rainbow .fuel-count { background: linear-gradient(90deg, #ff5f6d, #ffc371, #5ee7a0, #4facfe, #a18cd1); color: var(--night); }
@keyframes gain { 0% { box-shadow: 0 0 0 0 rgb(255 178 30 / .9); } 100% { box-shadow: 0 0 0 12px rgb(255 178 30 / 0); } }

/* Road */
.stage {
  position: relative;
  min-height: 0;
  border-radius: 14px;
  overflow: hidden;
  background: #2a3050;
}
.stage.shake { animation: shake .35s ease-out; }
canvas#road { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.flash { position: absolute; inset: 0; background: var(--kerb); opacity: 0; pointer-events: none; }
.flash.on { animation: flash .45s ease-out; }
@keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); }
  80% { transform: translateX(3px); }
}
/* Alerts pop up near the bottom of the road, right under the player's eyes */
.toast {
  position: absolute;
  bottom: 16px;
  left: 50%;
  z-index: 5;
  transform: translate(-50%, 12px) scale(.9);
  padding: 9px 20px;
  border-radius: 999px;
  background: var(--amber);
  color: var(--night);
  font-family: var(--font-display);
  font-size: 20px;
  white-space: nowrap;
  box-shadow: 0 4px 0 #8a5600, 0 0 22px rgb(255 178 30 / .55);
  opacity: 0;
  transition: opacity .18s, transform .18s;
  pointer-events: none;
}
.toast.on { opacity: 1; transform: translate(-50%, 0) scale(1); }
/* Music switch floats in the road's top-right corner, above every overlay */
.sound-btn {
  position: absolute;
  top: 10px; right: 10px;
  z-index: 20;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  border-radius: 50%;
  border: 1px solid var(--edge);
  background: rgb(19 21 27 / .72);
  color: var(--amber);
  cursor: pointer;
  touch-action: manipulation;
}
.sound-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sound-btn .spk { fill: currentColor; }
.sound-btn .off { display: none; }
.sound-btn.muted { color: var(--muted); }
.sound-btn.muted .on { display: none; }
.sound-btn.muted .off { display: inline; }
.sound-btn:focus-visible { outline: 3px solid var(--paint); outline-offset: 3px; }

/* Overlays scroll inside the road area if they ever run taller than it */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  overflow-y: auto;
  padding: 16px;
  text-align: center;
  background: rgb(19 21 27 / .72);
}
.overlay.over { background: rgb(110 18 18 / .62); }
.overlay.guide { background: rgb(19 21 27 / .94); }
.card { margin: auto; display: grid; gap: 12px; justify-items: center; width: 100%; max-width: 320px; }
.card.wide { max-width: 380px; }
.title {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(38px, 12vw, 54px);
  line-height: 1.05;
  margin: 0;
  color: var(--ink);
  text-wrap: balance;
  text-shadow: 0 4px 0 var(--kerb);
}
.title.small { font-size: clamp(26px, 8vw, 32px); text-shadow: 0 3px 0 var(--kerb); }
.lede { margin: 0; color: var(--ink); font-size: 14px; line-height: 1.55; text-wrap: balance; }
.keys { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; align-items: center; color: var(--muted); font-size: 12px; margin-top: 4px; }
.keys span { display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
kbd {
  display: inline-grid; place-items: center;
  min-width: 24px; height: 22px; padding: 0 5px;
  border: 1px solid var(--edge); border-bottom-width: 3px; border-radius: 6px;
  background: var(--panel); color: var(--ink); font-family: var(--font-body); font-size: 12px;
}
.result { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; font-variant-numeric: tabular-nums; }
.result small { display: block; font-family: var(--font-body); font-size: 14px; color: var(--ink); opacity: .8; margin-top: 4px; }
.cta {
  appearance: none;
  border: 0;
  border-radius: 12px;
  padding: 13px 30px;
  background: var(--amber);
  color: var(--night);
  font-family: var(--font-display);
  font-size: 22px;
  cursor: pointer;
  box-shadow: 0 4px 0 #b37708;
  touch-action: manipulation;
}
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 #b37708; }
/* Stacked buttons share one width; the secondary one sits a little lower */
.stack { display: grid; gap: 16px; width: max-content; }
.stack > * { width: 100%; }
.home {
  appearance: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 9px 12px;
  border: 2px solid var(--amber);
  border-radius: 12px;
  background: rgb(19 21 27 / .6);
  color: var(--amber);
  font-family: var(--font-display);
  font-size: 16px;
  white-space: nowrap;
  cursor: pointer;
  touch-action: manipulation;
}
.home span { font-family: var(--font-body); font-size: 17px; line-height: 1; }
.home:active { transform: translateY(2px); }
.cta:focus-visible, .pad:focus-visible, .home:focus-visible, .swatch:focus-visible { outline: 3px solid var(--paint); outline-offset: 3px; }

/* Main menu: title, one big start button, two small options underneath */
#startScreen { background: radial-gradient(ellipse at 50% 42%, rgb(19 21 27 / .8), rgb(19 21 27 / .3)); }
#startScreen .card { gap: 16px; }
.cta.big { padding: 15px 44px; font-size: 24px; }
.menu-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 4px; }
.chip-btn {
  appearance: none;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 15px;
  border-radius: 999px;
  border: 1px solid var(--edge);
  background: rgb(31 35 45 / .88);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.chip-btn:hover { border-color: var(--amber); }
.chip-btn:focus-visible { outline: 3px solid var(--paint); outline-offset: 3px; }
.dot { width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 2px var(--night), 0 0 0 3px var(--muted); }

/* Weather roulette: a slot reel that rattles through the weathers, then locks on one */
.overlay.roulette { background: rgb(19 21 27 / .55); }
.r-label { font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--ink); text-shadow: 0 2px 6px rgb(0 0 0 / .6); }
.reel {
  width: 210px; max-width: 100%; height: 92px;
  display: grid; place-items: center;
  overflow: hidden;
  border-radius: 18px;
  border: 3px solid var(--amber);
  background: rgb(19 21 27 / .88);
  box-shadow: 0 0 0 4px rgb(255 178 30 / .15), inset 0 10px 14px rgb(0 0 0 / .55), inset 0 -10px 14px rgb(0 0 0 / .55);
}
#reelText { font-family: var(--font-display); font-size: 54px; line-height: 1; color: var(--ink); }
#reelText.tick { animation: reel .09s linear; }
@keyframes reel { from { transform: translateY(-75%); opacity: .25; } to { transform: none; opacity: 1; } }
.reel.locked { animation: lock .45s ease-out; box-shadow: 0 0 0 6px rgb(255 178 30 / .35), 0 0 34px rgb(255 178 30 / .65); }
.reel.locked #reelText { color: var(--amber); }
@keyframes lock { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.r-sub { min-height: 1.5em; font-size: 16px; font-weight: 600; color: var(--ink); text-shadow: 0 2px 6px rgb(0 0 0 / .6); }

/* Car color picker: a panel at the top so the car stays visible underneath */
.overlay.garage { background: linear-gradient(180deg, rgb(19 21 27 / .9), rgb(19 21 27 / 0) 65%); }
.garage-panel { margin: 0 auto auto; display: grid; gap: 16px; justify-items: center; width: 100%; max-width: 320px; padding-top: 8px; }
.swatches { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
.swatch {
  appearance: none;
  width: 38px; height: 38px;
  border-radius: 50%;
  border: 3px solid var(--night);
  box-shadow: 0 0 0 2px var(--edge);
  cursor: pointer;
  touch-action: manipulation;
}
.swatch[aria-checked="true"] { box-shadow: 0 0 0 3px var(--ink); transform: scale(1.1); }

/* Nickname + live leaderboard */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.nick {
  width: 100%; max-width: 250px;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--edge);
  background: rgb(19 21 27 / .85);
  color: var(--ink);
  font-family: var(--font-body); font-size: 15px; font-weight: 600;
  text-align: center;
}
.nick::placeholder { color: var(--muted); font-weight: 400; }
.nick:focus { outline: 2px solid var(--amber); outline-offset: 1px; }
.rank-note { margin: 0; font-size: 13px; color: var(--muted); }
.rank-list { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 6px; }
.rank-list li {
  display: grid; grid-template-columns: 2.2em 1fr auto; align-items: center; gap: 10px;
  padding: 9px 12px;
  border-radius: 10px;
  background: var(--panel);
  border: 1px solid var(--edge);
  text-align: left;
  font-variant-numeric: tabular-nums;
}
.rank-list li.me { border-color: var(--amber); background: rgb(255 178 30 / .1); }
.rank-no { font-family: var(--font-display); font-size: 18px; color: var(--muted); }
.rank-list li:nth-child(1) .rank-no { color: #ffd34d; }
.rank-list li:nth-child(2) .rank-no { color: #d6dde8; }
.rank-list li:nth-child(3) .rank-no { color: #e0a46a; }
.rank-nick { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.rank-score { font-family: var(--font-display); color: var(--amber); }
.over-rank { display: grid; gap: 8px; justify-items: center; width: 100%; }
.over-rank .rank-msg { margin: 0; font-size: 15px; font-weight: 600; }
.over-rank .row { display: flex; gap: 8px; width: 100%; max-width: 280px; }
.over-rank .row .nick { flex: 1; min-width: 0; padding: 8px 10px; font-size: 14px; }
.small-btn {
  appearance: none; border: 0; border-radius: 10px; padding: 8px 14px;
  background: var(--amber); color: var(--night);
  font-family: var(--font-body); font-weight: 600; font-size: 14px; cursor: pointer;
}
.link-btn { appearance: none; background: none; border: 0; color: var(--ink); text-decoration: underline; font-size: 13px; cursor: pointer; }
.small-btn:focus-visible, .link-btn:focus-visible { outline: 3px solid var(--paint); outline-offset: 2px; }

/* Obstacle guide */
.guide-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; width: 100%; text-align: left; }
.guide-list li {
  display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center;
  padding: 8px 10px 8px 8px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--edge);
}
.guide-list li.good { border-color: var(--go); }
.thumb { width: 96px; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 8px; background: #2a3050; display: block; }
.g-name { display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 15px; }
.chip { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--kerb); color: var(--ink); }
.chip.good { background: var(--go); color: var(--night); }
.g-desc { margin: 4px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--muted); }

/* Controls: two raised steering keys and a glowing boost button between them */
.pads { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding-bottom: 5px; }
.pad {
  appearance: none;
  display: grid; place-items: center; align-content: center;
  height: clamp(60px, 11vh, 88px);
  border-radius: 18px;
  border: 1px solid var(--edge);
  background: linear-gradient(180deg, #2c323f, #1c2029);
  color: var(--ink);
  box-shadow: 0 5px 0 #0b0d12, inset 0 1px 0 rgb(255 255 255 / .08);
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform .06s, box-shadow .06s, color .1s;
}
.pad svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.pad.down { transform: translateY(4px); box-shadow: 0 1px 0 #0b0d12, inset 0 1px 0 rgb(255 255 255 / .08); color: var(--amber); border-color: var(--amber); }
/* Boost button: a dark key with a glowing amber rim and a neon double chevron, not a flat yellow block */
.pad.flybtn {
  gap: 4px;
  border: 2px solid var(--amber);
  background:
    radial-gradient(120% 90% at 50% 0%, rgb(255 178 30 / .3), transparent 62%),
    linear-gradient(180deg, #2c323f, #171a22);
  color: var(--amber);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 12px;
  letter-spacing: .32em;
  box-shadow: 0 5px 0 #0b0d12, inset 0 0 14px rgb(255 178 30 / .22), 0 0 14px rgb(255 178 30 / .28);
  animation: boost 1.6s ease-in-out infinite;
}
.pad.flybtn svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.8; filter: drop-shadow(0 0 6px rgb(255 178 30 / .75)); }
.pad.flybtn span { padding-left: .32em; }   /* balance the letter-spacing so the word sits centered */
.pad.flybtn.down { transform: translateY(4px); background: var(--amber); color: var(--night); box-shadow: 0 1px 0 #0b0d12, 0 0 26px rgb(255 178 30 / .7); }
.pad.flybtn.down svg { filter: none; }
.pad.flybtn.cooling {
  border-color: var(--edge);
  background: linear-gradient(180deg, #2c323f, #1c2029);
  color: var(--muted);
  box-shadow: 0 5px 0 #0b0d12;
  animation: none;
}
.pad.flybtn.cooling svg { filter: none; }
.pad.flybtn.rainbow {
  border-color: transparent;
  background: linear-gradient(180deg, #2c323f, #171a22) padding-box, linear-gradient(135deg, #ff5f6d, #ffc371, #5ee7a0, #4facfe, #a18cd1) border-box;
  color: var(--ink);
}
.pad.flybtn.rainbow svg { filter: drop-shadow(0 0 6px rgb(255 255 255 / .6)); }
@keyframes boost {
  50% { box-shadow: 0 5px 0 #0b0d12, inset 0 0 20px rgb(255 178 30 / .38), 0 0 24px rgb(255 178 30 / .5); }
}

@media (prefers-reduced-motion: reduce) {
  .stage.shake { animation: none; }
  .flash.on { animation-duration: .9s; }
  .pad.flybtn { animation: none; }
}
</style>

<div class="app">
  <header class="hud" aria-live="off">
    <div class="hud-cell">
      <span class="hud-label">버틴 시간</span>
      <span class="hud-time" id="hudTime">00.0<small>초</small></span>
    </div>
    <div class="gauge" id="gauge" role="img" aria-label="속도계">
      <svg viewBox="0 0 100 58" aria-hidden="true">
        <path class="gauge-track" d="M10 52 A40 40 0 0 1 90 52" pathLength="100" />
        <path class="gauge-fill" id="gaugeFill" d="M10 52 A40 40 0 0 1 90 52" pathLength="100" />
      </svg>
      <span class="gauge-num" id="hudSpeed">117</span>
      <span class="gauge-unit">km/h</span>
    </div>
    <div class="hud-cell right">
      <span class="hud-label">점수</span>
      <span class="hud-score" id="hudScore">000</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="road" aria-label="3D 3차선 도로"></canvas>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast">속도 UP</div>
    <button class="sound-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="배경음악 끄기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9h4l5-4v14l-5-4H4z" /><path class="on" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11" /><path class="off" d="M16 9l5 6M21 9l-5 6" /></svg>
    </button>

    <div class="overlay" id="startScreen">
      <div class="card">
        <h1 class="title">날아라 슈퍼카</h1>
        <p class="lede" id="startLede">장애물을 피하고, 막히면 날아서 넘어요!</p>
        <label class="sr-only" for="nickInput">닉네임</label>
        <input class="nick" id="nickInput" type="text" maxlength="10" placeholder="닉네임 입력 (순위에 표시)" autocomplete="off" spellcheck="false">
        <button class="cta big" id="startBtn" type="button">게임 시작</button>
        <div class="menu-row">
          <button class="chip-btn" id="colorBtn" type="button"><span class="dot" id="colorDot"></span>차 색깔</button>
          <button class="chip-btn" id="rankBtn" type="button">순위</button>
          <button class="chip-btn" id="guideBtn" type="button">장애물 설명</button>
        </div>
      </div>
    </div>

    <div class="overlay roulette" id="rouletteScreen" hidden aria-live="polite">
      <div class="card">
        <span class="r-label">오늘의 날씨는</span>
        <div class="reel" id="reel"><span id="reelText">맑음</span></div>
        <span class="r-sub" id="reelSub"></span>
      </div>
    </div>

    <div class="overlay garage" id="colorScreen" hidden>
      <div class="garage-panel">
        <h2 class="title small" id="colorTitle">차 색깔</h2>
        <div class="swatches" id="swatches" role="radiogroup" aria-labelledby="colorTitle"></div>
        <button class="cta" id="colorDone" type="button">완료</button>
      </div>
    </div>

    <div class="overlay guide" id="guideScreen" hidden>
      <div class="card wide">
        <h2 class="title small">장애물 설명</h2>
        <ul class="guide-list" id="guideList"></ul>
        <div class="keys">
          <span><kbd>←</kbd><kbd>→</kbd> 차선 이동</span>
          <span><kbd>스페이스</kbd> 또는 <kbd>▲</kbd> 날기</span>
        </div>
        <button class="cta" id="guideClose" type="button">알겠어요</button>
      </div>
    </div>

    <div class="overlay guide" id="rankScreen" hidden>
      <div class="card wide">
        <h2 class="title small">실시간 순위</h2>
        <p class="rank-note" id="rankNote">순위를 불러오는 중이에요…</p>
        <ol class="rank-list" id="rankList"></ol>
        <button class="cta" id="rankClose" type="button">닫기</button>
      </div>
    </div>

    <div class="overlay over" id="overScreen" hidden>
      <div class="card">
        <h2 class="title">GAME OVER</h2>
        <p class="lede" id="cause">차와 부딪혔어요!</p>
        <p class="result" id="finalTime">버틴 시간: 0.0초<small>점수 0점</small></p>
        <div class="over-rank" id="overRank" aria-live="polite"></div>
        <div class="stack">
          <button class="cta" id="retryBtn" type="button">다시 하기</button>
          <button class="home" id="homeBtn" type="button"><span aria-hidden="true">⌂</span> 메인화면으로</button>
        </div>
      </div>
    </div>
  </main>

  <div class="fuelrow" id="fuelBox" role="meter" aria-label="연료" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
    <svg class="pump" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 8h2l3 3v6.5a1.5 1.5 0 0 1-3 0V14h-2" /></svg>
    <span class="fuel-end">E</span>
    <span class="fuel-bar"><i id="fuelFill"></i></span>
    <span class="fuel-end">F</span>
    <span class="fuel-count" id="fuelCount">날기 2번</span>
  </div>

  <nav class="pads" aria-label="조작">
    <button class="pad steer" id="leftBtn" type="button" aria-label="왼쪽 차선으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
    <button class="pad flybtn" id="flyBtn" type="button" aria-label="날아서 앞차 뛰어넘기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l6-6 6 6M6 18.5l6-6 6 6" /></svg><span>날기</span></button>
    <button class="pad steer" id="rightBtn" type="button" aria-label="오른쪽 차선으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
  </nav>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  if (!window.THREE) {
    $('startLede').textContent = '3D 그래픽을 불러오지 못했어요. 페이지를 새로고침해 주세요.';
    $('startBtn').disabled = true;
    return;
  }

  // Balance numbers from the design doc, plus the 3D world (units are roughly metres)
  const CFG = {
    speedStepSec: 5,        // every 5s ...
    speedStepMul: 1.10,     // ... everything gets 10% faster
    spawnStart: 1.2,        // one obstacle every 1.2s at first
    spawnMin: 0.5,          // never faster than one every 0.5s
    spawnStepDown: 0.07,    // interval shrinks 0.07s per speed step (reaches 0.5s at ~50s)
    lanes: 3,
    hazardsAfter: 4,        // hazards and fuel cans may show up after 4s
    tireChance: 0.16,
    grannyChance: 0.10,
    deerChance: 0.10,
    fuelChance: 0.12,
    tireSpeedMul: 1.35,     // tires roll toward you faster than traffic
    grannyWalk: 0.37,       // road widths per second (about 1.1 lanes/s)
    deerHopSec: 0.55,       // the deer's leap from the roadside into the middle lane
    fuelMax: 100,
    fuelStart: 100,         // a full tank at the start: two hops
    flyCost: 35,
    fuelRefill: 40,
    rainbowAfter: 8,        // rainbow cans can show up after 8s ...
    rainbowShare: 0.3,      // ... as 30% of fuel cans (roughly one every 25s)
    rainbowSec: 5,          // eating one keeps the car flying this long
    laneGap: 2.4,
    baseSpeed: 26,          // world units per second at the start
    spawnZ: -95,            // obstacles appear this far ahead, inside the fog
    despawnZ: 14,
    flyHeight: 3.2,
    flyDist: 14,            // a hop lasts while traffic travels 14 units: one car plus margin
  };
  const CAUSE = {
    car: '차와 부딪혔어요!',
    tire: '굴러온 바퀴에 맞았어요!',
    granny: '할머니가 깜짝 놀라셨어요!<br>길 건너는 사람은 꼭 피해 주세요.',
    deer: '고라니와 부딪혔어요!<br>야생동물이 뛰어들면 속도를 줄이세요.',
  };
  const CAR_COLORS = [
    { name: '노랑', hex: '#ffb21e' },
    { name: '빨강', hex: '#e2493b' },
    { name: '파랑', hex: '#3d7bff' },
    { name: '초록', hex: '#2fbf71' },
    { name: '흰색', hex: '#eceff4' },
    { name: '보라', hex: '#9b6bff' },
  ];
  const TRAFFIC = ['#5b7cfa', '#e6e1d3', '#3fb6a8', '#c94f6d', '#8a6cf0'];
  const ROAD_HALF = CFG.laneGap * 1.5 + 0.5;
  const PLAYER = { w: 1.7, l: 3.4 };

  const stage = $('stage'), canvas = $('road');
  const hudTime = $('hudTime'), hudScore = $('hudScore'), hudSpeed = $('hudSpeed');
  const gauge = $('gauge'), gaugeFill = $('gaugeFill');
  const startScreen = $('startScreen'), overScreen = $('overScreen'), guideScreen = $('guideScreen'), colorScreen = $('colorScreen');
  const rouletteScreen = $('rouletteScreen');
  const flash = $('flash'), toast = $('toast');
  const leftBtn = $('leftBtn'), rightBtn = $('rightBtn'), flyBtn = $('flyBtn');
  const fuelBox = $('fuelBox'), fuelFill = $('fuelFill'), fuelCount = $('fuelCount');

  // ---------- three.js scene ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const SKY = 0x2a3050;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(SKY);
  scene.fog = new THREE.Fog(SKY, 50, 120);
  // near plane at 0.5 (not 0.1) keeps depth precision for the far mountains, so their faces don't shimmer
  const camera = new THREE.PerspectiveCamera(58, 1, 0.5, 220);
  function addLights(s) {
    const hemi = new THREE.HemisphereLight(0xc8d6ff, 0x3a3020, 0.95);
    const sun = new THREE.DirectionalLight(0xffe2b0, 0.85);
    sun.position.set(6, 12, 8);
    s.add(hemi, sun);
    return { hemi, sun };
  }
  const lights = addLights(scene);

  const matCache = {};
  const mat = (hex, emissive = 0) => {
    const k = hex + '|' + emissive;
    return matCache[k] || (matCache[k] = new THREE.MeshLambertMaterial({ color: hex, emissive }));
  };
  const BOX = new THREE.BoxGeometry(1, 1, 1);
  const CYL = new THREE.CylinderGeometry(1, 1, 1, 18);
  const SPH = new THREE.SphereGeometry(1, 18, 12);
  const CONE = new THREE.ConeGeometry(1, 1, 14);
  const TORUS = new THREE.TorusGeometry(0.42, 0.2, 10, 26);
  const PLANE = new THREE.PlaneGeometry(1, 1);
  function part(geo, m, sx, sy, sz, x, y, z) {
    const mesh = new THREE.Mesh(geo, m);
    mesh.scale.set(sx, sy, sz);
    mesh.position.set(x, y, z);
    return mesh;
  }
  function canvasTex(size, paint) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    paint(c.getContext('2d'), size);
    return new THREE.CanvasTexture(c);
  }
  const blobTex = canvasTex(64, (g, s) => {
    const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    r.addColorStop(0, 'rgba(0,0,0,.55)'); r.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = r; g.fillRect(0, 0, s, s);
  });
  const glowTex = canvasTex(128, (g, s) => {
    const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    r.addColorStop(0, 'rgba(255,236,150,1)'); r.addColorStop(.35, 'rgba(255,190,60,.6)'); r.addColorStop(1, 'rgba(255,178,30,0)');
    g.fillStyle = r; g.fillRect(0, 0, s, s);
  });
  const ringTex = canvasTex(128, (g, s) => {
    g.strokeStyle = 'rgba(255,224,130,1)'; g.lineWidth = 7;
    g.beginPath(); g.arc(s / 2, s / 2, s / 2 - 6, 0, Math.PI * 2); g.stroke();
  });
  const starTex = canvasTex(64, (g, s) => {
    const c = s / 2;
    g.fillStyle = '#fff6d6';
    g.beginPath();
    g.moveTo(c, 2); g.quadraticCurveTo(c, c, s - 2, c); g.quadraticCurveTo(c, c, c, s - 2);
    g.quadraticCurveTo(c, c, 2, c); g.quadraticCurveTo(c, c, c, 2);
    g.fill();
  });
  const blobMat = new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false });
  function shadow(w, l) {
    const m = new THREE.Mesh(PLANE, blobMat);
    m.rotation.x = -Math.PI / 2;
    m.scale.set(w, l, 1);
    m.position.y = 0.03;
    return m;
  }
  const glowSprite = (tex, scale) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    s.scale.set(scale, scale, 1);
    return s;
  };

  // ---------- models (all face -z = forward; the camera looks at their backs from +z) ----------
  function makeCar(color, isPlayer) {
    const g = new THREE.Group();
    const body = isPlayer ? new THREE.MeshLambertMaterial({ color }) : mat(color);
    g.add(shadow(2.5, 4.6));
    g.add(part(BOX, body, 1.7, 0.55, 3.4, 0, 0.62, 0));
    g.add(part(BOX, mat('#1a1d26'), 1.42, 0.5, 1.7, 0, 1.12, 0.15));
    g.add(part(BOX, body, 1.34, 0.08, 1.5, 0, 1.4, 0.15));
    const wheelM = mat('#0c0d11');
    const wheels = [[-0.82, -1.1], [0.82, -1.1], [-0.82, 1.1], [0.82, 1.1]].map(([x, z]) => {
      const w = part(CYL, wheelM, 0.36, 0.3, 0.36, x, 0.36, z);
      w.rotation.z = Math.PI / 2;
      w.userData.x0 = x;
      g.add(w);
      return w;
    });
    const tail = mat('#ff3b30', 0xaa1100);
    g.add(part(BOX, tail, 0.42, 0.16, 0.06, -0.55, 0.72, 1.71));
    g.add(part(BOX, tail, 0.42, 0.16, 0.06, 0.55, 0.72, 1.71));
    if (isPlayer) {
      const stripe = mat('#13151b');
      g.add(part(BOX, stripe, 0.34, 0.02, 3.42, 0, 0.9, 0));
      g.add(part(BOX, stripe, 0.34, 0.02, 1.52, 0, 1.45, 0.15));
      const head = mat('#fff6d6', 0xfff0c0);
      g.add(part(BOX, head, 0.42, 0.14, 0.06, -0.55, 0.72, -1.71));
      g.add(part(BOX, head, 0.42, 0.14, 0.06, 0.55, 0.72, -1.71));
      // thruster flames, shown only while flying
      const flames = [-0.5, 0.5].map(x => {
        const f = part(CONE, mat('#ff8c1e', 0xff6a00), 0.22, 0.9, 0.22, x, 0.05, 1.2);
        f.rotation.x = Math.PI;
        f.visible = false;
        g.add(f);
        return f;
      });
      // glow under each wheel once it folds flat into a hover pad
      const pads = wheels.map(w => {
        const p = glowSprite(glowTex, 1.2);
        p.position.set(w.position.x, 0.05, w.position.z);
        p.visible = false;
        g.add(p);
        return p;
      });
      // soft headlight glow on the road ahead, switched on at night
      const beams = [-0.55, 0.55].map(x => {
        const b = glowSprite(glowTex, 2.2);
        b.position.set(x, 0.75, -2.4);
        b.visible = false;
        g.add(b);
        return b;
      });
      g.userData = { body, flames, wheels, pads, beams };
    } else {
      g.userData = { wheels };
    }
    return g;
  }

  function makeTire() {
    const g = new THREE.Group();
    g.add(shadow(1.3, 1.3));
    const spin = new THREE.Group();
    spin.position.y = 0.62;
    const ring = new THREE.Mesh(TORUS, mat('#16181f'));
    ring.rotation.y = Math.PI / 2;
    spin.add(ring);
    const hub = part(CYL, mat('#9aa0ad'), 0.3, 0.32, 0.3, 0, 0, 0);
    hub.rotation.z = Math.PI / 2;
    spin.add(hub);
    // bolts so the roll is easy to see
    spin.add(part(BOX, mat('#5d6370'), 0.36, 0.1, 0.1, 0, 0.17, 0));
    spin.add(part(BOX, mat('#5d6370'), 0.36, 0.1, 0.1, 0, -0.17, 0));
    g.add(spin);
    g.userData = { spin };
    return g;
  }

  // Crosswalk stays fixed across the road; she walks along it (forward = local +x)
  function makeGranny() {
    const root = new THREE.Group();
    const walk = new THREE.Group();
    for (let x = -ROAD_HALF + 0.6; x < ROAD_HALF - 0.3; x += 1.0) walk.add(part(BOX, mat('#ece6d4'), 0.5, 0.02, 2.4, x, 0.02, 0));
    root.add(walk);
    const fig = new THREE.Group();
    fig.add(shadow(1, 1));
    const legM = mat('#4a3b33');
    const legL = part(CYL, legM, 0.07, 0.6, 0.07, 0, 0.3, -0.1);
    const legR = part(CYL, legM, 0.07, 0.6, 0.07, 0, 0.3, 0.1);
    fig.add(legL, legR);
    fig.add(part(CYL, mat('#5a4a7a'), 0.3, 0.4, 0.3, 0, 0.66, 0));
    fig.add(part(CYL, mat('#b07ad8'), 0.27, 0.52, 0.25, 0, 1.06, 0));
    const arm = part(CYL, mat('#b07ad8'), 0.06, 0.42, 0.06, 0.2, 1.02, 0.12);
    arm.rotation.z = -0.8;
    fig.add(arm);
    fig.add(part(CYL, mat('#a06a32'), 0.03, 0.95, 0.03, 0.36, 0.5, 0.12));
    fig.add(part(SPH, mat('#f2c9a5'), 0.2, 0.2, 0.2, 0.02, 1.5, 0));
    fig.add(part(SPH, mat('#ecebf2'), 0.21, 0.15, 0.21, -0.02, 1.58, 0));
    fig.add(part(SPH, mat('#ecebf2'), 0.1, 0.1, 0.1, -0.2, 1.62, 0));
    fig.add(part(BOX, mat('#2b2b33'), 0.02, 0.06, 0.24, 0.2, 1.52, 0));   // glasses
    root.add(fig);
    root.userData = { walk, fig, legL, legR };
    return root;
  }

  // Water deer (고라니), low-poly and flat-shaded: no antlers, big round ears, high rump,
  // pale belly, slim two-part legs with dark hooves, and the two little fangs it's known for (forward = local +x)
  const ICO = new THREE.IcosahedronGeometry(1, 1);
  const NECK = new THREE.CylinderGeometry(0.09, 0.14, 1, 8);
  const LEG_UP = new THREE.CylinderGeometry(0.06, 0.045, 1, 6);
  const LEG_LO = new THREE.CylinderGeometry(0.038, 0.03, 1, 6);
  let deerMats = null;   // shared by every deer, built on first use
  function makeDeer() {
    const flatMat = c => new THREE.MeshPhongMaterial({ color: c, flatShading: true, shininess: 0 });
    deerMats = deerMats || {
      fur: flatMat('#b9895a'), furDark: flatMat('#94673f'), belly: flatMat('#ead6b4'), earIn: flatMat('#e3b892'),
      hoof: mat('#2a1f18'), black: mat('#141418'), ivory: mat('#f5f2ea'),
    };
    const { fur, furDark, belly, earIn, hoof, black, ivory } = deerMats;
    const root = new THREE.Group();
    const sh = shadow(1.9, 0.9);
    root.add(sh);
    const deer = new THREE.Group();
    // body: chest, barrel, higher rump, pale underside
    deer.add(part(ICO, fur, 0.58, 0.28, 0.26, 0, 1.0, 0));
    deer.add(part(ICO, fur, 0.3, 0.3, 0.25, 0.4, 1.02, 0));
    deer.add(part(ICO, furDark, 0.32, 0.32, 0.27, -0.4, 1.08, 0));
    deer.add(part(ICO, belly, 0.46, 0.15, 0.21, 0.02, 0.86, 0));
    deer.add(part(ICO, belly, 0.07, 0.06, 0.06, -0.7, 1.14, 0));   // tail tuft
    // neck and head with a narrow snout
    const neck = part(NECK, fur, 1, 0.56, 1, 0.6, 1.32, 0);
    neck.rotation.z = -0.55;
    deer.add(neck);
    deer.add(part(ICO, fur, 0.19, 0.15, 0.14, 0.84, 1.6, 0));
    deer.add(part(ICO, furDark, 0.13, 0.08, 0.09, 1.0, 1.54, 0));
    deer.add(part(SPH, black, 0.045, 0.04, 0.05, 1.11, 1.56, 0));
    // big round ears with a lighter inside
    [-1, 1].forEach(s => {
      const ear = part(ICO, fur, 0.07, 0.15, 0.035, 0.76, 1.8, s * 0.11);
      ear.rotation.x = s * 0.45;
      deer.add(ear);
      const inner = part(ICO, earIn, 0.045, 0.1, 0.02, 0.775, 1.8, s * 0.125);
      inner.rotation.x = s * 0.45;
      deer.add(inner);
      // dark eye with a tiny highlight
      deer.add(part(SPH, black, 0.032, 0.032, 0.032, 0.93, 1.65, s * 0.115));
      deer.add(part(SPH, ivory, 0.01, 0.01, 0.01, 0.95, 1.665, s * 0.13));
      // curved fang hanging below the upper lip
      const fang = part(CONE, ivory, 0.022, 0.17, 0.022, 0.98, 1.43, s * 0.045);
      fang.rotation.set(0, 0, Math.PI - 0.25);
      deer.add(fang);
    });
    // legs pivot at the hip/shoulder so they can splay mid-leap
    const legs = [[0.4, -0.12], [0.4, 0.12], [-0.42, -0.12], [-0.42, 0.12]].map(([x, z]) => {
      const leg = new THREE.Group();
      leg.position.set(x, 0.92, z);
      leg.add(part(LEG_UP, x > 0 ? fur : furDark, 1, 0.44, 1, 0, -0.2, 0));
      leg.add(part(LEG_LO, furDark, 1, 0.42, 1, 0, -0.62, 0));
      leg.add(part(BOX, hoof, 0.08, 0.07, 0.07, 0.01, -0.85, 0));
      deer.add(leg);
      return leg;
    });
    root.add(deer);
    root.userData = { deer, legs, sh };
    return root;
  }

  // Fuel can: spins, bobs, glows and throws off sparkles so it reads as a pickup.
  // The rainbow can gets its own material so its colour can cycle through the spectrum.
  function makeFuel(rainbow = false) {
    const root = new THREE.Group();
    root.add(shadow(1.3, 1.3));
    const can = new THREE.Group();
    can.position.y = 0.9;
    const bodyMat = rainbow ? new THREE.MeshLambertMaterial({ color: 0xff3355, emissive: 0x441122 }) : mat('#d8463b', 0x5a1208);
    can.add(part(BOX, bodyMat, 0.8, 1.0, 0.45, 0, 0, 0));
    can.add(part(BOX, mat('#a3322a'), 0.5, 0.18, 0.12, -0.1, 0.58, 0));
    can.add(part(CYL, mat('#e6e1d3'), 0.08, 0.25, 0.08, 0.25, 0.6, 0));
    [0.6, -0.6].forEach(r => {

  // ---------- scenery: road, kerbs, dashes, trees, lamps (recycled as they pass the camera) ----------
  // road and ground get their own materials so the weather can recolor them
  const road = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_HALF * 2, 400), new THREE.MeshLambertMaterial({ color: '#2a2e38' }));
  road.rotation.x = -Math.PI / 2;

  const white = mat('#ece6d4');

  const RANGE = 160;
  const movers = [];

  // Low-poly trees: tiered pines, round leafy trees and bushes, flat-shaded so each facet catches the light

  const leafMats = ['#2f6b45', '#3d7d4f', '#28583b', '#4a8a4f', '#356e3a', '#5b8f3e'].map(flat);
  const barkMat = flat('#5b4030');
  const TRUNK = new THREE.CylinderGeometry(0.1, 0.18, 1, 7);
  const PINE = new THREE.ConeGeometry(1, 1, 8);
  const LEAF = new THREE.IcosahedronGeometry(1, 0);
  function makePine(m) {
    const t = new THREE.Group();
    t.add(part(TRUNK, barkMat, 1, 1.4, 1, 0, 0.7, 0));
    [[1.35, 1.7, 1.7], [1.05, 1.5, 2.6], [0.72, 1.3, 3.4]].forEach(([r, h, y], k) => {
      const tier = part(PINE, m, r, h, r, 0, y, 0);

  }
  function makeLeafy(m) {
    const t = new THREE.Group();
    t.add(part(TRUNK, barkMat, 1.2, 1.8, 1.2, 0, 0.9, 0));
    [[0, 2.5, 0, 1.15], [0.55, 2.15, 0.25, 0.8], [-0.5, 2.2, -0.2, 0.85], [0.1, 3.05, -0.1, 0.75]].forEach(([x, y, z, r]) => {
      const clump = part(LEAF, m, r, r * 0.9, r, x, y, z);
      clump.rotation.set(x, y, z);
      t.add(clump);
    });
    return t;
  }
  function makeBush(m) {
    const t = new THREE.Group();
    [[0, 0.35, 0, 0.55], [0.5, 0.3, 0.1, 0.4], [-0.45, 0.28, -0.1, 0.38]].forEach(([x, y, z, r]) => t.add(part(LEAF, m, r, r * 0.8, r, x, y, z)));
    return t;
  }
  const roadTrees = [];   // swapped for cacti in the desert
  for (let i = 0; i < 70; i++) {
    const side = i % 2 ? 1 : -1, m = leafMats[i % leafMats.length], kind = Math.random();
    const near = i % 5 < 2;   // two in five hug the roadside, the rest fill the distance
    const tree = kind < 0.5 ? makePine(m) : kind < 0.85 ? makeLeafy(m) : makeBush(m);
    tree.add(shadow(2.6, 2.6));
    const sc = 0.75 + Math.random() * 0.6;

    tree.rotation.y = Math.random() * Math.PI * 2;
    tree.position.set(side * (ROAD_HALF + (near ? 2.8 + Math.random() * 3 : 6 + Math.random() * 16)), 0, 10 - Math.random() * RANGE);
    addMover(tree);

  }
  // Hills and dunes sit across the far road; any that would cover it get pushed to the side,

  const clearOfRoad = (x, r) => (Math.abs(x) < r + ROAD_HALF + 2 ? (x < 0 ? -1 : 1) * (r + ROAD_HALF + 2) : x);

  // Each run draws one background theme; only that group is shown (see setWeather)
  const themes = { mountain: new THREE.Group(), desert: new THREE.Group() };
  Object.values(themes).forEach(g => scene.add(g));

  // Horizon: low-poly mountains (some snow-capped). They ignore the fog and take a tint
  // from the sky in setWeather instead, so they read as far away.
  const horizonMat = () => new THREE.MeshPhongMaterial({ flatShading: true, shininess: 0, fog: false });
  const mountainMats = [horizonMat(), horizonMat()];
  const mountainBase = [new THREE.Color('#4f6b5a'), new THREE.Color('#3f5a4e')];
  const capMat = horizonMat();
  const MOUNT = new THREE.ConeGeometry(1, 1, 6);
  for (let i = 0; i < 12; i++) {
    const r = 18 + Math.random() * 22, h = 16 + Math.random() * 26;
    const x = -130 + i * 23 + (Math.random() - 0.5) * 10, z = -150 - Math.random() * 30, ry = Math.random();
    const m = part(MOUNT, mountainMats[i % 2], r, h, r, x, h / 2 - 2, z);
    m.rotation.y = ry;
    themes.mountain.add(m);

      const cap = part(MOUNT, capMat, r * 0.33, h * 0.31, r * 0.33, x, h - 2 - h * 0.155 + 0.3, z);

  }
  // Desert: sand dunes, red flat-topped mesas on the horizon, and cacti in place of the roadside trees
  const duneMat = new THREE.MeshLambertMaterial({ color: '#d9b77a' });
  for (let i = 0; i < 10; i++) {
    const r = 18 + Math.random() * 16;
    const x = clearOfRoad(-130 + i * 28 + (Math.random() - 0.5) * 10, r);
    themes.desert.add(part(SPH, duneMat, r, 4 + Math.random() * 4, 10 + Math.random() * 8, x, -2, -85 - Math.random() * 30));
  }
  const mesaMats = [horizonMat(), horizonMat()];
  const mesaBase = [new THREE.Color('#c9774a'), new THREE.Color('#b0603a')];
  const MESA = new THREE.CylinderGeometry(0.85, 1, 1, 7);
  for (let i = 0; i < 9; i++) {
    const r = 10 + Math.random() * 14, h = 10 + Math.random() * 16;
    const mesa = part(MESA, mesaMats[i % 2], r, h, r * (0.6 + Math.random() * 0.4), -120 + i * 30 + (Math.random() - 0.5) * 12, h / 2 - 1, -145 - Math.random() * 35);
    mesa.rotation.y = Math.random();
    themes.desert.add(mesa);
  }
  const cactusMat = flat('#3f8a4a');
  const cacti = [];
  for (let i = 0; i < 36; i++) {
    const side = i % 2 ? 1 : -1, c = new THREE.Group(), h = 1.6 + Math.random() * 1.4;
    c.add(shadow(1.4, 1.4));
    c.add(part(CYL, cactusMat, 0.28, h, 0.28, 0, h / 2, 0));
    c.add(part(SPH, cactusMat, 0.28, 0.28, 0.28, 0, h, 0));
    [-1, 1].forEach(s => {
      if (Math.random() < 0.25) return;
      const ah = 0.5 + Math.random() * 0.6, y = h * (0.4 + Math.random() * 0.25);
      const stub = part(CYL, cactusMat, 0.17, 0.5, 0.17, s * 0.4, y, 0);
      stub.rotation.z = Math.PI / 2;
      c.add(stub);
      c.add(part(CYL, cactusMat, 0.17, ah, 0.17, s * 0.62, y + ah / 2, 0));
      c.add(part(SPH, cactusMat, 0.17, 0.17, 0.17, s * 0.62, y + ah, 0));
    });
    const sc = 0.9 + Math.random() * 0.6;
    c.scale.set(sc, sc, sc);
    c.position.set(side * (ROAD_HALF + 2.8 + Math.random() * 14), 0, 10 - Math.random() * RANGE);
    c.visible = false;
    addMover(c);
    cacti.push(c);
  }

  // Flying cars cruising over the road and fields, big enough to read as cars (forward = local +x)
  const flyerColors = ['#e8ecf2', '#ffb21e', '#3d7bff', '#e2493b', '#9b6bff'];
  const whiteGlowTex = canvasTex(128, (g, s) => {
    const r = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.4, 'rgba(235,245,255,.55)'); r.addColorStop(1, 'rgba(220,235,255,0)');
    g.fillStyle = r; g.fillRect(0, 0, s, s);
  });
  // A small pool: they sit hidden and one is launched across the sky every few seconds
  const flyers = [];
  for (let i = 0; i < 4; i++) {
    const f = new THREE.Group();
    // a real car (the same model as road traffic) turned to face +x, its wheels folded flat into glowing hover pads
    const car = makeCar(flyerColors[i % flyerColors.length], false);
    car.rotation.y = -Math.PI / 2;
    car.children[0].visible = false;   // no road shadow up in the air
    car.userData.wheels.forEach(w => {
      const side = Math.sign(w.userData.x0);
      w.rotation.z = Math.PI / 2 + side * (Math.PI / 2);
      w.position.x = w.userData.x0 + side * 0.3;
      w.position.y = 0.28;
      const pad = glowSprite(whiteGlowTex, 1.8);   // white hover light
      pad.position.set(w.position.x, 0.05, w.position.z);
      car.add(pad);
    });
    f.add(car);
    f.scale.setScalar(1.5 + Math.random() * 0.5);
    f.visible = false;
    f.userData = { active: false, dir: 1, speed: 0, bob: Math.random() * 6 };
    scene.add(f);
    flyers.push(f);
  }
  let flyerTimer = 3;   // seconds until the next flying car crosses
  function launchFlyer() {
    const f = flyers.find(x => !x.userData.active);
    if (!f) return;
    const u = f.userData, dir = Math.random() < 0.5 ? 1 : -1;
    u.active = true;
    u.dir = dir;
    u.speed = 16 + Math.random() * 8;
    f.rotation.y = dir > 0 ? 0 : Math.PI;
    f.position.set(-dir * 70, 9 + Math.random() * 12, -20 - Math.random() * 55);
    f.visible = true;
  }
  function animateFlyers(dt) {
    flyerTimer -= dt;
    if (flyerTimer <= 0) { launchFlyer(); flyerTimer = 5 + Math.random() * 6; }
    flyers.forEach(f => {
      const u = f.userData;
      if (!u.active) return;
      f.position.x += u.dir * u.speed * dt;
      f.position.y += Math.sin(clock * 1.5 + u.bob) * 0.6 * dt;
      f.rotation.x = Math.sin(clock * 1.2 + u.bob) * 0.1;    // gentle side-to-side roll
      f.rotation.z = 0.06;                                     // nose slightly up, like it's climbing
      if (Math.abs(f.position.x) > 72) { u.active = false; f.visible = false; }
    });
  }

  // Middle distance: rolling green hills with spinning wind turbines, and a few hot-air balloons
  const hillMat = new THREE.MeshLambertMaterial({ color: '#4c8048' });
  for (let i = 0; i < 9; i++) {
    const r = 22 + Math.random() * 14;
    const x = clearOfRoad(-110 + i * 28 + (Math.random() - 0.5) * 10, r);
    themes.mountain.add(part(SPH, hillMat, r, 7 + Math.random() * 5, 14 + Math.random() * 8, x, -3, -100 - Math.random() * 18));
  }
  const turbineWhite = mat('#eef1f5');
  const turbines = [];
  [-62, -38, -22, 26, 44, 70].forEach((x, i) => {
    const t = new THREE.Group(), z = -96 - (i % 3) * 7;
    t.add(part(CYL, turbineWhite, 0.25, 15, 0.25, 0, 7.5, 0));
    t.add(part(BOX, turbineWhite, 0.9, 0.7, 1.6, 0, 15, -0.3));
    const rotor = new THREE.Group();
    rotor.position.set(0, 15, 0.6);
    rotor.add(part(SPH, turbineWhite, 0.35, 0.35, 0.35, 0, 0, 0));
    for (let b = 0; b < 3; b++) {
      const blade = part(BOX, turbineWhite, 0.35, 6.5, 0.08, 0, 3.2, 0);
      const arm = new THREE.Group();
      arm.rotation.z = b * Math.PI * 2 / 3;
      arm.add(blade);
      rotor.add(arm);
    }
    rotor.rotation.z = Math.random() * Math.PI;
    t.add(rotor);
    t.position.set(x, 1, z);
    themes.mountain.add(t);
    turbines.push({ rotor, speed: 0.8 + Math.random() * 0.6 });
  });
  const balloonColors = ['#e2493b', '#ffb21e', '#3d7bff', '#2fbf71'];
  const balloons = [];
  for (let i = 0; i < 3; i++) {
    const b = new THREE.Group(), env = mat(balloonColors[i % balloonColors.length]);
    b.add(part(SPH, env, 2.2, 2.6, 2.2, 0, 3.4, 0));
    b.add(part(SPH, mat('#fff6d6'), 2.25, 0.5, 2.25, 0, 3.6, 0));   // pale band around the middle
    const neck = part(CONE, env, 1.2, 1.4, 1.2, 0, 0.9, 0);
    neck.rotation.x = Math.PI;
    b.add(neck);
    b.add(part(BOX, mat('#8a5a32'), 0.7, 0.55, 0.7, 0, -0.2, 0));   // basket
    b.position.set(-50 + i * 45 + Math.random() * 10, 18 + Math.random() * 8, -55 - Math.random() * 30);
    b.userData = { drift: 0.6 + Math.random() * 0.6, bob: Math.random() * 6 };
    themes.mountain.add(b);
    balloons.push(b);
  }
  function animateCountryside(dt) {
    turbines.forEach(t => { t.rotor.rotation.z += t.speed * dt; });
    balloons.forEach(b => {
      b.position.x += b.userData.drift * dt;
      b.position.y += Math.sin(clock * 0.6 + b.userData.bob) * 0.3 * dt;
      if (b.position.x > 80) b.position.x -= 160;
    });
  }


  for (let z = 10; z > 10 - RANGE; z -= 20) {
    [-1, 1].forEach(s => {
      const lamp = new THREE.Group();
      lamp.add(part(CYL, mat('#4a4f5c'), 0.07, 4.2, 0.07, 0, 2.1, 0));
      lamp.add(part(BOX, mat('#4a4f5c'), 1.0, 0.1, 0.12, -s * 0.45, 4.2, 0));
      lamp.add(part(BOX, mat('#fff1c4', 0xffd27a), 0.4, 0.12, 0.25, -s * 0.85, 4.12, 0));
      lamp.position.set(s * (ROAD_HALF + 1.2), 0, z);
      addMover(lamp);
    });
  }
  // ---------- time of day × weather: both are drawn fresh for every run ----------
  // light: how bright that time of day is, used to darken weather tints and snow at night
  const MORNING = { name: '아침', sky: 0xbfe1f6, fog: [60, 140], hemi: 1.2, sun: 1.0, sunColor: 0xffe2bf, ground: '#40723f', road: '#3c414c', light: 1 };
  const TIMES = [
    MORNING,
    { name: '낮', sky: 0x87bdf0, fog: [60, 140], hemi: 1.15, sun: 1.0, sunColor: 0xfff1d6, ground: '#3b6a3a', road: '#3a3f4a', light: 1 },
    { name: '노을', sky: 0xe98b6a, fog: [45, 125], hemi: 0.9, sun: 0.95, sunColor: 0xffb070, ground: '#3b5534', road: '#2f3340', light: 0.8 },
    { name: '저녁', sky: 0x2a3050, fog: [50, 120], hemi: 0.95, sun: 0.85, sunColor: 0xffe2b0, ground: '#2b4230', road: '#2a2e38', light: 0.55 },
    { name: '밤', sky: 0x0e1226, fog: [35, 105], hemi: 0.55, sun: 0.35, sunColor: 0x9fb4ff, ground: '#1e3024', road: '#23262f', light: 0.3, night: true },
  ];
  // mix: how much the weather's cloud tint covers the sky
  const WEATHERS = [
    { name: '맑음', mix: 0, light: 1 },
    { name: '비', tint: 0x4a5466, mix: 0.7, light: 0.75, fogMul: 0.8, precip: 'rain' },
    { name: '눈', tint: 0xb8c4d4, mix: 0.6, light: 0.95, fogMul: 0.85, precip: 'snow' },
  ];

  // Rain streaks or snowflakes: one particle cloud kept around the camera and recycled as it falls
  const PCOUNT = 1400;
  const pPos = new Float32Array(PCOUNT * 3);
  for (let i = 0; i < PCOUNT; i++) {
    pPos[i * 3] = (Math.random() - 0.5) * 30;
    pPos[i * 3 + 1] = Math.random() * 16;
    pPos[i * 3 + 2] = 10 - Math.random() * 70;
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  const rainTex = canvasTex(32, (g, s) => {
    const gr = g.createLinearGradient(0, 0, 0, s);

    g.fillStyle = gr; g.fillRect(s / 2 - 1, 0, 2, s);
  });
  const snowTex = canvasTex(32, (g, s) => {
